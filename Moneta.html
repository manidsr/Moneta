<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moneta</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f6;--card:#fff;--tx:#14201e;--mu:#6b7b78;--bd:#e3e9e8;--ac:#0f766e;--acs:#e1f3f0;--ex:#c2453d;--in:#15803d;--wa:#b7791f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1514;--card:#16201f;--tx:#e8f0ee;--mu:#8da09c;--bd:#26332f;--ac:#2dd4bf;--acs:#12332f;--ex:#f0827a;--in:#4ade80;--wa:#f0b429}}
:root[data-theme=dark]{--bg:#0e1514;--card:#16201f;--tx:#e8f0ee;--mu:#8da09c;--bd:#26332f;--ac:#2dd4bf;--acs:#12332f;--ex:#f0827a;--in:#4ade80;--wa:#f0b429}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Manrope,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
aside{background:var(--card);border-right:1px solid var(--bd);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.logo{font-weight:700;font-size:18px;padding:4px 10px 18px;display:flex;gap:8px;align-items:center}.logo i{width:22px;height:22px;border-radius:7px;background:var(--ac);display:inline-block}
.nav{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--mu);text-decoration:none;font-weight:500}
.nav:hover{background:var(--bg)}.nav.on{background:var(--acs);color:var(--ac);font-weight:600}
.side-foot{margin-top:auto;border-top:1px solid var(--bd);padding:12px 8px 0;font-size:12px;color:var(--mu)}
main{padding:0 28px 40px;min-width:0}
header{display:flex;gap:12px;align-items:center;padding:18px 0;flex-wrap:wrap}
header h1{font-size:22px;margin:0}header small{color:var(--mu);display:block;font-weight:400;font-size:13px}
.sp{flex:1}
.inp,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-height:38px}
.btn{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;min-height:38px;font-weight:600}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}[data-theme=dark] .btn.p{color:#04201c}.btn.d{color:var(--ex)}
.btn:hover{filter:brightness(.96)}.btn[disabled]{opacity:.5;cursor:default}
.g{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.6fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g22{grid-template-columns:1fr 1fr}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;min-width:0}
.c h3{margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:8px}
.mu{color:var(--mu)}.big{font-size:24px;font-weight:700;margin:4px 0}.in{color:var(--in)}.ex{color:var(--ex)}.wa{color:var(--wa)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th{text-align:left;color:var(--mu);font-weight:500;font-size:12px;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--bd)}tr.r{cursor:pointer}tr.r:hover td{background:var(--bg)}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);white-space:nowrap}.chip b{width:8px;height:8px;border-radius:50%}
.bar{height:8px;background:var(--bg);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}.bar.w i{background:var(--wa)}.bar.x i{background:var(--ex)}
.tabs{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-left:auto}.tabs button{border:0;background:none;padding:5px 12px}.tabs .on{background:var(--acs);color:var(--ac);font-weight:600}
.bn{background:#fdf3dc;color:#7a5410;border-radius:8px;padding:8px 12px;margin-bottom:16px;font-size:13px}[data-theme=dark] .bn{background:#3a2e10;color:#f0d28a}
.dn{width:130px;height:130px;border-radius:50%;flex:none;-webkit-mask:radial-gradient(circle 40px,#0000 98%,#000);mask:radial-gradient(circle 40px,#0000 98%,#000)}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:7px 0}.fl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dr{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:var(--card);border-left:1px solid var(--bd);box-shadow:-8px 0 30px #0003;padding:20px;overflow:auto;z-index:20}
.ov{position:fixed;inset:0;background:#0006;z-index:19}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}.dr .inp,.dr select,.dr textarea{width:100%}.err{color:var(--ex);font-size:12px}
.bars{display:flex;align-items:flex-end;gap:4px;height:190px;border-bottom:1px solid var(--bd)}.bars div{flex:1;display:flex;align-items:flex-end;gap:1px;height:100%}.bars i{flex:1;border-radius:3px 3px 0 0;min-height:1px}
.xl{display:flex;gap:4px;font-size:10px;color:var(--mu)}.xl span{flex:1;text-align:center;overflow:hidden}
.emp{text-align:center;padding:36px 10px;color:var(--mu)}
#tt{position:fixed;background:var(--tx);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;pointer-events:none;z-index:30;display:none}
#mb{display:none}
@media(max-width:1000px){.g4,.g3{grid-template-columns:1fr 1fr}.g2,.g22{grid-template-columns:1fr}}
@media(max-width:760px){#app{grid-template-columns:1fr}aside{position:fixed;z-index:15;width:240px;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none}#mb{display:inline-flex}main{padding:0 14px 40px}.g4,.g3{grid-template-columns:1fr}.dn{width:110px;height:110px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="app"><aside id="sb"></aside><main><header id="hd"></header><div id="pg"></div></main></div>
<div id="dr"></div><div id="tt"></div>
<script>
const $=s=>document.querySelector(s),N=new Date();
const CATS=[['food','Groceries','#0f766e','e'],['din','Dining','#d97706','e'],['trn','Transport','#2563eb','e'],['bil','Utilities','#7c3aed','e'],['shp','Shopping','#db2777','e'],['hlt','Health','#dc2626','e'],['sal','Salary','#15803d','i'],['fre','Freelance','#65a30d','i'],['unx','Uncategorized','#6b7280','e'],['uni','Uncategorized','#6b7280','i']].map(([id,name,color,t])=>({id,name,color,t}));
const cat=id=>CATS.find(c=>c.id==id)||CATS[0];
const MER={food:['Hyperstar','Refah Store','Fruit Market'],din:['Cafe Naderi','Snappfood','Pizza Kuche'],trn:['Snapp','Tapsi','Tehran Metro'],bil:['Irancell','Tehran Power','Gas Co.'],shp:['Digikala','Bamilo','Zara'],hlt:['Dr. Karimi Clinic','Daroo Pharmacy']};
let S={cur:'toman',theme:'system',page:'dashboard',range:'month',tx:[],f:{q:'',type:'',cat:'',st:'',sort:'date',dir:-1,p:0},bo:0,
 budgets:{food:9e6,din:4e6,trn:3e6,bil:5e6,shp:6e6,hlt:2.5e6},goals:[{id:1,name:'Laptop',target:6e7,saved:2.4e7,due:'2027-03-01'},{id:2,name:'Emergency fund',target:15e7,saved:4.5e7,due:''}],
 bills:[],sync:{ok:N.getTime()-18*6e4,fail:0,pending:0},open:null};
let seed=7;const R=()=>(seed=seed*16807%2147483647)/2147483647;
(function(){let id=1;for(let d=0;d<120;d++){const t=new Date(N.getFullYear(),N.getMonth(),N.getDate()-d,9+Math.floor(R()*12),Math.floor(R()*60));
 const add=(type,c,desc,amt,src)=>S.tx.push({id:id++,type,cat:c,desc,amount:Math.round(amt/1e4)*1e4,date:t.getTime(),src:src||'sms',st:R()<.08?'review':'ok',note:'',ref:'SMS-'+(100000+id*37),created:t.getTime()});
 if(t.getDate()==1)add('income','sal','Employer payroll',48e6);if(t.getDate()==15&&R()<.7)add('income','fre','Client transfer',(6+R()*8)*1e6);
 const k=R()<.7?1:0;if(k||d%3==0){const ids=Object.keys(MER),c=ids[Math.floor(R()*ids.length)],m=MER[c];add('expense',c,m[Math.floor(R()*m.length)],c=='bil'?(.6+R()*1.4)*1e6:c=='shp'?(.5+R()*2.5)*1e6:(.08+R()*.9)*1e6);}}
 S.tx.sort((a,b)=>a.date-b.date);let b=32e6;S.tx.forEach(t=>{b+=t.type=='income'?t.amount:-t.amount;t.bal=t.src=='sms'?b:null});
 const dd=n=>new Date(N.getFullYear(),N.getMonth(),N.getDate()+n).toISOString().slice(0,10);
 S.bills=[{id:1,name:'Rent',amount:15e6,cat:'bil',due:dd(3),every:'Monthly',active:1,paid:0},{id:2,name:'Internet',amount:8e5,cat:'bil',due:dd(-2),every:'Monthly',active:1,paid:0},{id:3,name:'Gym',amount:12e5,cat:'hlt',due:dd(9),every:'Monthly',active:1,paid:0},{id:4,name:'Car insurance',amount:21e6,cat:'bil',due:dd(40),every:'Yearly',active:1,paid:0}];S.nid=id})();
const RATE=10,f=n=>{const v=S.cur=='toman'?n:n*RATE;return Math.round(v).toLocaleString('en-US')+(S.cur=='toman'?' T':' IRR')};
const TZ='Asia/Tehran',JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'],
WD={Sat:'شنبه',Sun:'یکشنبه',Mon:'دوشنبه',Tue:'سه‌شنبه',Wed:'چهارشنبه',Thu:'پنجشنبه',Fri:'جمعه'},
pd=n=>String(n),
_jf=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{timeZone:TZ,year:'numeric',month:'numeric',day:'numeric'}),
_tf=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}),
_wf=new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'short'}),
jp=d=>{const o={};for(const p of _jf.formatToParts(d))o[p.type]=+p.value;o.year=o.year||o.relatedYear;return o},
wd=d=>WD[_wf.format(d)],dk=d=>{const j=jp(d);return j.year*400+j.month*32+j.day},
jl=d=>{const j=jp(d);return wd(d)+' '+j.year+'/'+j.month+'/'+j.day};
const sgn=t=>(t.type=='income'?'+':'−')+f(t.amount),dt=ms=>{const j=jp(ms);return j.year+'/'+j.month+'/'+j.day},tm=ms=>pd(_tf.format(ms));
const mk=d=>{const j=jp(d);return j.year*12+j.month-1},cm=()=>mk(N)+S.bo,inM=(t,m)=>mk(new Date(t.date))==m;
const sum=(a,ty)=>a.filter(t=>t.type==ty).reduce((s,t)=>s+t.amount,0),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cb=id=>`<span class="chip"><b style="background:${cat(id).color}"></b>${cat(id).name}</span>`;
const spent=(c,m)=>S.tx.filter(t=>t.type=='expense'&&t.cat==c&&inM(t,m)).reduce((s,t)=>s+t.amount,0);
const pct=(a,b)=>b?Math.round(a/b*100):0,delta=(a,b)=>b?`<span class="mu">${a>=b?'▲':'▼'} ${Math.abs(Math.round((a-b)/b*100))}% vs last month</span>`:'';
const empty=(m,a)=>`<div class="emp">${m}${a?`<div style="margin-top:10px">${a}</div>`:''}</div>`;
const NAV=[['dashboard','Dashboard','▦'],['transactions','Transactions','⇄'],['budgets','Budgets','◔'],['analytics','Analytics','↗'],['goals','Savings Goals','◎'],['bills','Bills & Recurring','▤'],['settings','Settings','⚙']];
const TTL={dashboard:'Dashboard',transactions:'Transactions',budgets:'Budgets',analytics:'Analytics',goals:'Savings Goals',bills:'Bills & Recurring',settings:'Settings'};
function bars(rows){const mx=Math.max(1,...rows.flatMap(r=>[r.a,r.b]));if(!rows.some(r=>r.a||r.b))return empty('No transactions in this range.');
 return `<div class="bars">${rows.map(r=>`<div data-tt="${esc(r.l)}: income ${f(r.a)} · expenses ${f(r.b)}"><i style="height:${r.a/mx*100}%;background:var(--in)"></i><i style="height:${r.b/mx*100}%;background:var(--ex)"></i></div>`).join('')}</div><div class="xl">${rows.map((r,i)=>`<span>${rows.length>14&&i%5?'':r.l}</span>`).join('')}</div><div class="mu" style="font-size:12px;margin-top:8px"><span class="in">■</span> Income &nbsp;<span class="ex">■</span> Expenses</div>`}
function series(range){const out=[];if(range=='year'){for(let i=11;i>=0;i--){const m=mk(N)-i,l=JM[m%12],a=S.tx.filter(t=>inM(t,m));out.push({l,a:sum(a,'income'),b:sum(a,'expense')})}}
 else{const n=range=='week'?7:30;for(let i=n-1;i>=0;i--){const d=new Date(N.getTime()-i*864e5),a=S.tx.filter(t=>dk(t.date)==dk(d));out.push({l:range=='week'?wd(d):pd(jp(d).day),a:sum(a,'income'),b:sum(a,'expense')})}}return out}
function donut(m){const ex=S.tx.filter(t=>t.type=='expense'&&inM(t,m)),tot=sum(ex,'expense'),rows=CATS.filter(c=>c.t=='e').map(c=>({c,v:spent(c.id,m),p:spent(c.id,m-1)})).filter(r=>r.v).sort((a,b)=>b.v-a.v);
 if(!tot)return empty('No expenses this month.');let a=0;const g=rows.map(r=>{const s=a;a+=r.v/tot*100;return `${r.c.color} ${s}% ${a}%`}).join(',');
 return `<div class="fl" style="flex-wrap:nowrap"><div class="dn" style="background:conic-gradient(${g})" role="img" aria-label="Spending by category"></div><div style="flex:1;min-width:0">${rows.map(r=>`<button class="row" data-go="transactions" data-cat="${r.c.id}" style="width:100%;border:0;background:none;text-align:left">${cb(r.c.id)}<span>${f(r.v)} <span class="mu">${pct(r.v,tot)}%${r.p?` · ${r.v>=r.p?'▲':'▼'}${Math.abs(pct(r.v-r.p,r.p))}%`:''}</span></span></button>`).join('')}</div></div>`}
function budgetBox(m){const tot=Object.values(S.budgets).reduce((a,b)=>a+b,0),sp=Object.keys(S.budgets).reduce((s,c)=>s+spent(c,m),0),near=Object.keys(S.budgets).filter(c=>spent(c,m)/S.budgets[c]>=.8);
 return `<div class="row"><span class="mu">Spent ${f(sp)} of ${f(tot)}</span><b class="${tot-sp<0?'ex':''}">${f(tot-sp)} left</b></div><div class="bar ${sp>tot?'x':sp/tot>.8?'w':''}"><i style="width:${Math.min(100,pct(sp,tot))}%"></i></div>${near.length?`<div style="margin-top:10px">${near.map(c=>`<div class="row">${cb(c)}<span class="${spent(c,m)>S.budgets[c]?'ex':'wa'}">${pct(spent(c,m),S.budgets[c])}% used</span></div>`).join('')}</div>`:'<p class="mu">All categories are within limits.</p>'}`}
function rowT(t){return `<tr class="r" tabindex="0" data-open="${t.id}"><td>${dt(t.date)} <span class="mu">${tm(t.date)}</span></td><td>${esc(t.desc)}</td><td>${cb(t.cat)}</td><td>${t.type}</td><td class="n ${t.type=='income'?'in':'ex'}">${sgn(t)}</td><td class="n mu">${t.bal!=null?f(t.bal):'—'}</td><td>${t.src=='sms'?'SMS':'Manual'}${t.st=='review'?' · <span class="wa">Needs review</span>':''}</td></tr>`}
const TH='<tr><th>Date</th><th>Description</th><th>Category</th><th>Type</th><th class="n">Amount</th><th class="n">Balance after</th><th>Source</th></tr>';
const P={};
P.dashboard=()=>{const m=mk(N),a=S.tx.filter(t=>inM(t,m)),p=S.tx.filter(t=>inM(t,m-1)),inc=sum(a,'income'),exp=sum(a,'expense'),last=[...S.tx].reverse().find(t=>t.bal!=null),rv=S.tx.filter(t=>t.st=='review').length;
 const M=(l,v,d,c)=>`<div class="c"><div class="mu">${l}</div><div class="big ${c||''}">${v}</div>${d||''}</div>`;
 return `<div class="g g4">${M('Current balance',f(last.bal),`<span class="mu">From bank SMS, ${dt(last.date)} ${tm(last.date)}</span>`)}${M('Income this month',f(inc),delta(inc,sum(p,'income')),'in')}${M('Expenses this month',f(exp),delta(exp,sum(p,'expense')),'ex')}${M('Net savings',f(inc-exp),`<span class="mu">${inc?Math.round((inc-exp)/inc*100)+'% of income':''}</span>`)}</div>
 <div class="g g2" style="margin-top:16px"><div class="c"><h3>Income vs. expenses<span class="tabs">${['week','month','year'].map(r=>`<button data-range="${r}" class="${S.range==r?'on':''}">${r[0].toUpperCase()+r.slice(1)}</button>`).join('')}</span></h3>${bars(series(S.range))}</div><div class="c"><h3>Spending by category</h3>${donut(m)}</div></div>
 <div class="g g2" style="margin-top:16px"><div class="c"><h3>Recent transactions<button class="btn" style="margin-left:auto" data-go="transactions">View all</button></h3><div class="tw"><table>${TH}${[...S.tx].reverse().slice(0,7).map(rowT).join('')}</table></div></div><div class="g"><div class="c"><h3>Monthly budget</h3>${budgetBox(m)}</div>
 <div class="c"><h3>Upcoming &amp; goals</h3>${S.bills.filter(b=>!b.paid&&b.active).sort((x,y)=>x.due<y.due?-1:1).slice(0,3).map(b=>`<div class="row"><span>${esc(b.name)} <span class="mu">${b.due}</span></span><b class="${b.due<N.toISOString().slice(0,10)?'ex':''}">${f(b.amount)}</b></div>`).join('')}<hr style="border:0;border-top:1px solid var(--bd)">${S.goals.map(g=>`<div class="row"><span>${esc(g.name)}</span><span class="mu">${pct(g.saved,g.target)}%</span></div><div class="bar"><i style="width:${pct(g.saved,g.target)}%"></i></div>`).join('')}</div>
 <div class="c"><h3>Sync</h3><div class="row"><span class="mu">Last successful sync</span><span>${tm(S.sync.ok)}</span></div><div class="row"><span class="mu">Awaiting review</span><button class="btn" data-go="transactions" data-st="review">${rv}</button></div></div></div></div>`};
function filt(){const F=S.f,q=F.q.toLowerCase();let r=S.tx.filter(t=>(!q||(t.desc+t.note).toLowerCase().includes(q))&&(!F.type||t.type==F.type)&&(!F.cat||t.cat==F.cat)&&(!F.st||t.st==F.st));return r.sort((a,b)=>(F.sort=='amount'?a.amount-b.amount:a.date-b.date)*F.dir)}
P.transactions=()=>{const F=S.f,r=filt(),pc=Math.max(1,Math.ceil(r.length/15));F.p=Math.min(F.p,pc-1);
 return `<div class="c"><div class="fl" style="margin-bottom:12px"><input class="inp" id="q" placeholder="Search description or note" value="${esc(F.q)}" aria-label="Search"><select data-f="type" aria-label="Type"><option value="">All types<option value="income"${F.type=='income'?' selected':''}>Income<option value="expense"${F.type=='expense'?' selected':''}>Expense</select><select data-f="cat" aria-label="Category"><option value="">All categories${CATS.map(c=>`<option value="${c.id}"${F.cat==c.id?' selected':''}>${c.name}`).join('')}</select><select data-f="st" aria-label="Status"><option value="">Any status<option value="review"${F.st=='review'?' selected':''}>Needs review<option value="ok"${F.st=='ok'?' selected':''}>Confirmed</select><select data-f="sort" aria-label="Sort"><option value="date">Sort: date<option value="amount"${F.sort=='amount'?' selected':''}>Sort: amount</select><button class="btn" data-dir>${F.dir<0?'Newest / largest first':'Oldest / smallest first'}</button><button class="btn" data-clear>Clear</button></div>
 ${r.length?`<div class="tw"><table>${TH}${r.slice(F.p*15,F.p*15+15).map(rowT).join('')}</table></div><div class="row"><span class="mu">${r.length} transactions</span><span class="fl"><button class="btn" data-pg="-1"${F.p?'':' disabled'}>Previous</button>${F.p+1} / ${pc}<button class="btn" data-pg="1"${F.p+1<pc?'':' disabled'}>Next</button></span></div>`:empty('No transactions match these filters.','<button class="btn" data-clear>Clear filters</button>')}</div>`};
P.budgets=()=>{const m=cm(),d=new Date(Math.floor(m/12),m%12,1),free=CATS.filter(c=>c.t=='e'&&!S.budgets[c.id]);

 try{
